name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build JsonOverride.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: JsonOverride
          path: out/JsonOverride.dll
